<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent View</title>
<!--VENDOR-->
<!--NAVIGATION-->
<style>
  :root {
    --bg: #1b1b1a; --panel: #232322; --card: #2a2a28; --line: #3a3a37; --text: #e8e6e1;
    --dim: #9a978f; --faint: #6d6a63; --accent: #d97757;
    --run: #4fb477; --wait: #e0a43c; --err: #e06c5f; --done: #7c8a9a;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f6f2; --panel: #efede7; --card: #fff; --line: #dcd9d0; --text: #23221f;
            --dim: #6b685f; --faint: #9c988d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  button:hover { border-color: var(--dim); }

  body > header { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  body > header .brand { font-weight: 600; letter-spacing: .2px; }
  body > header .spacer { flex: 1; }
  .pill { font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; }
  #toggleSessions { display: none; }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(0, 1.1fr);
    height: calc(100% - 40px); }
  .layout.no-detail { grid-template-columns: 260px minmax(0, 1fr); }
  .layout.no-detail #detail { display: none; }

  #sessions { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  #sessions .filter { padding: 8px 10px; display: flex; gap: 6px; align-items: center;
    color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); position: sticky;
    top: 0; background: var(--panel); z-index: 1; }
  .sess { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sess:hover { background: var(--card); }
  .sess.active { background: var(--card); box-shadow: inset 3px 0 var(--accent); }
  .sess .t { display: flex; gap: 6px; align-items: baseline; }
  .sess .t span.title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host { flex: none; font-size: 10px; line-height: 15px; padding: 0 5px; border: 1px solid var(--line);
    border-radius: 4px; color: var(--dim); font-family: var(--mono); }
  .pill.err { color: var(--err); }
  header label.follow { font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .sess .m { color: var(--faint); font-size: 11px; margin-top: 2px; padding-left: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #map { overflow: auto; padding: 14px 16px 40px; }
  #map h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #map .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .counts { display: flex; gap: 12px; margin-bottom: 14px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .counts b { color: var(--text); font-weight: 600; }

  .tree { list-style: none; margin: 0; padding: 0; }
  .tree .children { list-style: none; margin: 0 0 0 14px; padding: 0 0 0 16px;
    border-left: 1px solid var(--line); }
  .tree .children > li { position: relative; }
  .tree .children > li::before { content: ""; position: absolute; left: -16px; top: 22px;
    width: 14px; border-top: 1px solid var(--line); }
  .tree .children > li:last-child::after { content: ""; position: absolute; left: -17px;
    top: 23px; bottom: 0; width: 3px; background: var(--bg); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; margin: 6px 0; cursor: pointer; max-width: 640px; }
  .card:hover { border-color: var(--dim); }
  .card.selected { border-color: var(--accent); }
  .card .row1 { display: flex; align-items: center; gap: 7px; }
  .card .label { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 5px; white-space: nowrap; }
  .card .tool { margin-top: 5px; font-family: var(--mono); font-size: 11.5px; color: var(--text);
    background: var(--bg); border-radius: 5px; padding: 3px 7px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .card .tool .n { color: var(--accent); margin-right: 6px; }
  .card .stats { margin-top: 5px; color: var(--dim); font-size: 11.5px; display: flex;
    gap: 10px; flex-wrap: wrap; }
  .card .stats .err { color: var(--err); }

  .viewsw { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .viewsw button { border: none; border-radius: 0; padding: 2px 9px; font-size: 12px; color: var(--dim); }
  .viewsw button.on { background: var(--card); color: var(--text); }

  /* graph view: root on the left, children fan out to the right with elbow connectors */
  .graph { overflow: auto; padding: 4px 2px 12px; }
  .hn { display: flex; align-items: center; }
  .hkids { display: flex; flex-direction: column; margin-left: 20px; position: relative; }
  .hkids::before { content: ""; position: absolute; left: -20px; top: 50%; width: 20px;
    border-top: 1px solid var(--line); }
  .hkids > .hn { position: relative; padding: 4px 0 4px 20px; }
  .hkids > .hn::before { content: ""; position: absolute; left: 0; top: 50%; width: 20px;
    border-top: 1px solid var(--line); }
  .hkids > .hn::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    border-left: 1px solid var(--line); }
  .hkids > .hn:first-child::after { top: 50%; }
  .hkids > .hn:last-child::after { bottom: 50%; }
  .hkids > .hn:only-child::after { display: none; }
  .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
    width: 260px; flex: none; cursor: pointer; }
  .gcard:hover { border-color: var(--dim); }
  .gcard.selected { border-color: var(--accent); }
  .gcard .t { display: flex; align-items: center; gap: 7px; }
  .gcard .t .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .gcard.root .t .label { font-weight: 600; }
  .gcard .m { color: var(--faint); font-size: 11.5px; margin-top: 2px; padding-left: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gcard .m .err { color: var(--err); }
  .gcard .tl { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 3px; padding-left: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gcard .tl .n { color: var(--accent); margin-right: 5px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); display: inline-block; }
  .dot.running { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
  .dot.waiting { background: var(--wait); animation: pulse 1s ease-in-out infinite; }
  .dot.done { background: var(--done); }
  .dot.stale { background: var(--err); opacity: .6; }
  .dot.idle, .dot.ended { background: var(--faint); }
  .dot.ok { background: var(--run); }
  .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .st { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .st.running { color: var(--run); } .st.waiting { color: var(--wait); }

  #detail { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #detail .dh { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  #detail .dh .label { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .dh label { color: var(--dim); font-size: 12px; display: flex; gap: 4px; align-items: center; }
  #log { flex: 1; overflow: auto; padding: 10px 12px 60px; }
  .msg { margin: 8px 0; }
  .msg .who { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.user .body { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  .msg.thinking .body { color: var(--faint); font-style: italic; max-height: 4.4em; overflow: hidden; cursor: pointer; }
  .msg.thinking.open .body { max-height: none; }
  .msg.system .body { color: var(--faint); text-align: center; font-size: 12px; }
  /* rendered Markdown / MyST / KaTeX */
  .msg .body.md { white-space: normal; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote, .md aside, .md dl { margin: 0 0 .6em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md h1, .md h2, .md h3, .md h4 { margin: .8em 0 .4em; line-height: 1.3; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; } .md h4 { font-size: 1em; }
  .md code { font-family: var(--mono); font-size: .92em; background: var(--card); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 3px; }
  .md pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
    overflow-x: auto; white-space: pre; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md a { color: var(--accent); }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 9px; color: var(--dim); }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 8px; }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  .md img { max-width: 100%; }
  .md .katex-display, .md div.math { overflow-x: auto; overflow-y: hidden; }
  .md div.math { position: relative; }
  .md .mathlabel { position: absolute; right: 0; top: 0; color: var(--faint); text-decoration: none; font-size: 11px; }
  .md .myst-target { font-size: 11px; color: var(--faint); } .md .myst-target a { color: inherit; text-decoration: none; }
  .md aside.admonition { border: 1px solid var(--line); border-left: 3px solid var(--done); border-radius: 6px;
    padding: 6px 10px; background: var(--card); color: inherit; font-size: inherit; text-align: left; margin: 0 0 .6em; }
  .md aside.admonition > header { font-weight: 600; margin-bottom: 3px; }
  .md aside.note, .md aside.info, .md aside.seealso { border-left-color: #5b8fd6; }
  .md aside.tip, .md aside.hint, .md aside.important { border-left-color: var(--run); }
  .md aside.warning, .md aside.caution, .md aside.attention { border-left-color: var(--wait); }
  .md aside.danger, .md aside.error { border-left-color: var(--err); }
  .md .footnotes { font-size: .92em; color: var(--dim); }
  .md .math-error { color: var(--err); }
  .tu { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
    margin: 6px 0; overflow: hidden; }
  .tu .h { padding: 4px 8px; cursor: pointer; display: flex; gap: 8px; background: var(--card); }
  .tu .h .n { color: var(--accent); flex: none; }
  .tu .h .b { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tu .h .r { flex: none; color: var(--faint); }
  .tu .h .r.err { color: var(--err); }
  .tu .h .r.pending { color: var(--run); }
  .tu pre { margin: 0; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; max-height: 360px;
    overflow: auto; border-top: 1px solid var(--line); font-size: 11.5px; }
  .tu pre.res { color: var(--dim); }
  .tu pre.res.err { color: var(--err); }
  .tg { margin: 6px 0; }
  .tg > .gh { font-size: 12px; color: var(--dim); cursor: pointer; display: flex; gap: 8px;
    align-items: center; padding: 3px 2px; user-select: none; }
  .tg > .gh:hover { color: var(--text); }
  .tg > .gh .caret { font-size: 9px; width: 10px; flex: none; transition: transform .1s; }
  .tg.open > .gh .caret { transform: rotate(90deg); }
  .tg > .gh .names { font-family: var(--mono); font-size: 11.5px; color: var(--faint); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg > .gh .r { flex: none; color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
  .tg > .gh .r.err { color: var(--err); }
  .tg > .gh .r.pending { color: var(--run); }
  .tg > .gb { margin-left: 5px; padding-left: 10px; border-left: 1px solid var(--line); }
  .tg:not(.open) > .gb { display: none; }
  .note { color: var(--faint); font-size: 12px; text-align: center; margin: 8px 0; }
  .empty { color: var(--faint); padding: 40px 20px; text-align: center; }

  /* narrow: the Browser pane beside a conversation is usually < 900px wide */
  @media (max-width: 900px) {
    #toggleSessions { display: inline-block; }
    .layout, .layout.no-detail { grid-template-columns: minmax(0, 1fr); position: relative; }
    #sessions { position: absolute; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 5;
      transform: translateX(-100%); transition: transform .15s; }
    body.show-sessions #sessions { transform: none; box-shadow: 4px 0 16px #0006; }
    #detail { position: absolute; inset: 0; z-index: 4; background: var(--bg); border-left: none; }
  }
  body.embedded #sessions { display: none; }
  body.embedded .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
  body.embedded .layout.no-detail { grid-template-columns: minmax(0, 1fr); }

  /* The header, focused parent and page controls never scroll with the children. */
  .layout > * { min-width: 0; min-height: 0; }
  #sessions { display: flex; flex-direction: column; overflow: hidden; }
  #sessions .filter { display: block; position: static; flex: none; }
  .filter input[type=search], .map-search { width: 100%; min-width: 0; font: inherit;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  .filter .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
  #sessList { overflow: auto; flex: 1; }
  .sidebar-pages, .pagebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 7px 10px; border-top: 1px solid var(--line); font-size: 12px; flex: none; }
  button:disabled { opacity: .45; cursor: default; }
  #currentSession { display: block; width: 100%; text-align: left; margin-top: 7px; overflow-wrap: anywhere; }
  .project { border-bottom: 1px solid var(--line); }
  .project-heading { display: flex; align-items: center; gap: 4px; padding: 7px 8px; }
  .project-open { flex: 1; min-width: 0; text-align: left; border: none; }
  .project-open .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-open small { display: block; color: var(--dim); font-size: 11px; font-weight: normal; }
  .project-pin { border: none; flex: none; }
  .project-pin.on { color: var(--accent); }
  .project-sessions { border-top: 1px solid var(--line); }
  button.sess { display: block; width: 100%; border: none; border-radius: 0; text-align: left; }
  #catalogState { color: var(--dim); padding: 7px 10px; font-size: 11px; flex: none; overflow-wrap: anywhere; }
  #map { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
  .map-header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); flex: none; }
  #map .sub { margin-bottom: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #map .counts { gap: 5px; margin: 7px 0; }
  .counts button { font-size: 12px; }
  .counts button.on { border-color: var(--accent); background: var(--card); }
  .map-controls { display: flex; gap: 8px; align-items: center; }
  .map-search { flex: 1; }
  .map-controls .viewsw { flex: none; }
  .branch-nav { padding: 7px 14px; border-bottom: 1px solid var(--line); flex: none; }
  #breadcrumbs { display: flex; gap: 5px; align-items: center; overflow-x: auto; white-space: nowrap; font-size: 11px; }
  #breadcrumbs button { border: none; padding: 2px 3px; flex: none; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .parent-line { display: flex; gap: 7px; align-items: center; margin-top: 5px; }
  #parentLabel { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #parentStats { color: var(--dim); font-size: 11px; margin-top: 3px; }
  #selectionHint { color: var(--dim); font-size: 11px; margin-top: 5px; }
  #selectionHint button { padding: 1px 5px; }
  .pagebar { border-top: none; border-bottom: 1px solid var(--line); padding: 6px 14px; }
  #pageSummary { flex: 1; color: var(--dim); }
  #pageJump { width: 52px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px; }
  #mapViewport { overflow: auto; min-height: 0; flex: 1; padding: 8px 14px 24px; }
  #mapNodes { display: flex; flex-direction: column; gap: 6px; }
  #mapNodes.focus-graph { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
    align-content: start; border-top: 1px solid var(--line); padding-top: 10px; }
  .agent-row { background: var(--card); border: 1px solid var(--line); border-radius: 6px; min-width: 0; overflow: hidden; }
  .agent-row.selected { border-color: var(--accent); }
  .agent-select { display: block; width: 100%; padding: 7px 9px; border: none; border-radius: 0; text-align: left; }
  .agent-top { display: flex; gap: 7px; align-items: center; }
  .agent-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .agent-meta, .agent-path { margin-top: 3px; color: var(--dim); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 0 9px 6px; font-size: 11px; }
  .agent-actions .branch-counts { flex: 1; color: var(--dim); }
  .agent-actions button { font-size: 11px; padding: 2px 6px; }
  #finishedSummary { border-top: 1px solid var(--line); padding: 6px 14px; color: var(--dim); font-size: 11px; flex: none; }
  #finishedSummary button { font-size: 11px; }
  #mapNodes .empty { grid-column: 1 / -1; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    body.embedded .layout, body.embedded .layout.no-detail { grid-template-columns: minmax(0, 1fr); }
    .map-header { padding: 9px 10px 6px; }
    .branch-nav, .pagebar, #finishedSummary { padding-left: 10px; padding-right: 10px; }
    #mapViewport { padding-left: 10px; padding-right: 10px; }
    #detail .dh { flex-wrap: wrap; }
  }
  @media (max-width: 420px) {
    body > header { gap: 6px; padding: 0 8px; }
    #hookState { display: none; }
    .map-controls { flex-wrap: wrap; }
    .map-search { flex-basis: 100%; }
    .counts button { padding: 3px 5px; }
    .parent-line { flex-wrap: wrap; }
    #parentLabel { min-width: 100px; }
  }
</style>
</head>
<body>
<header>
  <button id="toggleSessions" title="会话列表">☰</button>
  <span class="brand">Agent View</span>
  <span class="spacer"></span>
  <label class="follow" title="在 Claude Desktop 里切到哪个会话（包括 SSH 会话），这里就显示哪个"><input type="checkbox" id="followDesktop"> 跟随 Desktop</label>
  <span class="pill" id="remoteState"></span>
  <span class="pill" id="hookState"></span>
  <span class="pill" id="connState"><span class="dot"></span>连接中</span>
</header>
<div class="layout no-detail" id="layout">
  <aside id="sessions">
    <div class="filter">
      <input type="search" id="sessionQuery" placeholder="搜索全部项目和会话" aria-label="搜索全部项目和会话">
      <div class="filter-row"><label><input type="checkbox" id="onlyActive"> 只看活跃</label><span id="projectCount"></span></div>
      <button id="currentSession" hidden></button>
    </div>
    <div id="sessList"></div>
    <div class="sidebar-pages"><button id="projectsPrev" aria-label="上一页项目">上一页</button><span id="projectsPage"></span><button id="projectsNext" aria-label="下一页项目">下一页</button></div>
    <div id="catalogState" role="status"></div>
  </aside>
  <section id="map" aria-label="Agent 分层浏览">
    <div class="map-header">
      <h2 id="mapTitle">加载中…</h2><div class="sub" id="mapMeta"></div>
      <div class="counts" id="mapCounts" aria-label="Agent 状态筛选"></div>
      <div class="map-controls"><input type="search" id="agentQuery" class="map-search" placeholder="搜索整场会话的 agent、工具或 ID" aria-label="搜索整场会话的 agent">
        <span class="viewsw"><button id="listView">大纲</button><button id="graphView">聚焦图</button></span></div>
    </div>
    <div class="branch-nav"><nav id="breadcrumbs" aria-label="当前分支路径"></nav>
      <div class="parent-line"><span class="dot" id="parentDot"></span><span id="parentLabel">主会话</span><button id="parentRecord">查看记录</button><button id="backToMain">回到主会话</button></div>
      <div id="parentStats"></div><div id="selectionHint" hidden></div></div>
    <div class="pagebar"><span id="pageSummary" aria-live="polite"></span><button id="agentsPrev" aria-label="上一页子节点">上一页</button>

<script>
"use strict";
const STATUS = { running: "运行中", waiting: "等待确认", idle: "空闲", done: "已完成",
                 stale: "无更新", ended: "已结束" };
const $ = (id) => document.getElementById(id);
const Nav = AgentNavigation;
function readSetting(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function writeSetting(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* a private browser may disallow storage */ }
}
const state = { sessions: [], sid: null, detail: null, aid: null, transcript: null,
                full: false, open: new Set(), groups: new Map(), hooksLast: 0, clockSkew: 0,
                projects: [], projectOffset: 0, projectOpen: undefined, projectSessions: null, catalog: null,
                projectPins: new Set([].concat(readSetting("agentView.projectPins", [])).filter(id => typeof id === "string").slice(-50)),
                sidebarRequest: 0, projectRequest: 0, detailRequest: 0, sidebarKey: "",
                index: null, nav: null, navSaved: readSetting("agentView.navigation", {}), catalogTimer: null };
if (!state.navSaved || typeof state.navSaved !== "object" || Array.isArray(state.navSaved)) state.navSaved = {};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);

  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const now = () => Date.now() / 1000 + state.clockSkew;
function dur(s) {
  if (s == null || s < 0) return "";
  s = Math.round(s);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
}
function ago(t) {
  if (!t) return "";
  const s = now() - t;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}
const ktok = (n) => !n ? "0" : n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(1) + "k" : (n / 1e6).toFixed(2) + "M";
const active = (st) => st === "running" || st === "waiting";
const base = Nav.basename;

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
function debounce(fn, ms) {

}

// Reuse keyed elements and patch their text/attributes in place. Event handlers
// capture stable IDs, never snapshot offsets or node objects.
function patchElement(old, next) {
  if (old.nodeType !== next.nodeType || old.nodeName !== next.nodeName) { old.replaceWith(next); return; }
  if (old.nodeType === Node.TEXT_NODE) { if (old.data !== next.data) old.data = next.data; return; }
  if (old.getAttribute("data-session") !== next.getAttribute("data-session") ||
      old.getAttribute("data-control") !== next.getAttribute("data-control")) { old.replaceWith(next); return; }
  for (const attr of [...old.attributes]) if (!next.hasAttribute(attr.name)) old.removeAttribute(attr.name);
  for (const attr of next.attributes) if (old.getAttribute(attr.name) !== attr.value) old.setAttribute(attr.name, attr.value);
  const children = [...next.childNodes];
  for (let i = 0; i < children.length; i++) {
    if (old.childNodes[i]) patchElement(old.childNodes[i], children[i]);
    else old.append(children[i]);

  while (old.childNodes.length > children.length) old.lastChild.remove();
}
function keyedList(container, entries, keyOf, render, viewport = container) {

  const anchorKey = anchor?.dataset.key, offset = anchor ? anchor.getBoundingClientRect().top - top : 0;
  const scroll = viewport.scrollTop;
  const old = new Map([...container.children].map(el => [el.dataset.key, el]));
  const keys = new Set();
  entries.forEach((item, i) => {
    const key = String(keyOf(item)); keys.add(key);
    const next = render(item); next.dataset.key = key;
    let el = old.get(key);
    if (el) patchElement(el, next); else el = next;
    if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null);
  });
  for (const [key, el] of old) if (!keys.has(key)) el.remove();
  const kept = [...container.children].find(el => el.dataset.key === anchorKey);
  viewport.scrollTop = kept ? scroll + kept.getBoundingClientRect().top - top - offset : scroll;
}

function pager(meta, previous, next, label) {
  previous.disabled = !meta || meta.offset === 0;
  next.disabled = !meta || meta.next_offset == null;
  label.textContent = meta ? `${Math.floor(meta.offset / meta.limit) + 1} / ${Math.max(1, Math.ceil(meta.total / meta.limit))}` : "";
}

// ------------------------------------------------------------------ sessions
function sessionQuery(extra = {}) {
  const q = new URLSearchParams({ limit: "20", q: $("sessionQuery").value.trim(),
    active: $("onlyActive").checked ? "1" : "0", current: state.sid || "", ...extra });
  return "/api/sessions?" + q;
}
function stableItems(old, fresh) {
  const byId = new Map(fresh.map(item => [item.id, item]));
  const result = old.filter(item => byId.has(item.id)).map(item => byId.get(item.id));
  const seen = new Set(result.map(item => item.id));

}
async function loadSessions(locate = false) {

  const d = await getJSON(sessionQuery({ view: "projects", offset: String(state.projectOffset),
    pinned: [...state.projectPins].join(","), locate: locate ? "1" : "0" }));
  if (request !== state.sidebarRequest) return;
  state.clockSkew = d.now - Date.now() / 1000;
  state.projects = state.sidebarKey === key && !locate ? stableItems(state.projects, d.projects || []) : d.projects || [];
  state.sidebarKey = key;
  state.projectOffset = d.offset;
  state.catalog = d;
  state.hooksLast = d.hooks_last;
  if (locate && d.current) state.projectOpen = d.current.project_id;
  if (state.projectOpen === undefined || (state.projectOpen !== null && !state.projects.some(p => p.id === state.projectOpen)))
    state.projectOpen = state.projects[0]?.id || null;

  renderHookState();
  renderSessions();
  if (state.projectOpen) await loadProject(state.projectOpen, undefined, locate);
  if (request !== state.sidebarRequest) return;

  state.catalogTimer = setTimeout(() => loadSessions().catch(showCatalogError), d.indexing ? 750 : 5000);
}
function showCatalogError(error) {
  $("catalogState").textContent = "读取项目失败：" + error.message;
}
async function loadProject(id, offset, locate = false) {
  const request = ++state.projectRequest;
  const key = JSON.stringify([id, $("sessionQuery").value.trim(), $("onlyActive").checked]);
  const old = state.projectSessions;
  if (offset == null) offset = old?.key === key ? old.offset : 0;
  const d = await getJSON(sessionQuery({ project: id, offset: String(offset), locate: locate ? "1" : "0" }));
  if (request !== state.projectRequest || state.projectOpen !== id) return;
  d.sessions = old?.key === key && old.offset === offset ? stableItems(old.sessions, d.sessions) : d.sessions;
  state.projectSessions = { ...d, key, project: id };

}

  writeSetting("agentView.projectPins", [...state.projectPins].slice(-50));
  state.projectOffset = 0; state.sidebarKey = "";

}
function renderProject(project) {
  const id = project.id, open = state.projectOpen === id, pinned = state.projectPins.has(id);
  const details = [project.host && "ssh " + project.host, project.cwd].filter(Boolean).join(" · ");
  const out = h("section", { class: "project" },
    h("div", { class: "project-heading" },
      h("button", { class: "project-open", title: details, "aria-expanded": String(open), onclick: () => chooseProject(id) },
        h("span", { class: "title" }, (open ? "▾ " : "▸ ") + project.label,
          project.host ? " · " + project.host : ""),
        h("small", {}, `${project.sessions} 个会话 · ${project.active_sessions} 活跃`)),
      h("button", { class: "project-pin" + (pinned ? " on" : ""), "aria-label": (pinned ? "取消置顶 " : "置顶 ") + project.label,
        "aria-pressed": String(pinned), onclick: () => togglePin(id) }, pinned ? "★" : "☆")));
  if (!open) return out;

  const content = h("div", { class: "project-sessions" });

    for (const s of d.sessions) content.append(h("button", { class: "sess" + (s.id === state.sid ? " active" : ""),
      "data-session": s.id, onclick: () => { selectSession(s.id); document.body.classList.remove("show-sessions"); } },
      h("div", { class: "t" }, h("span", { class: "dot " + s.status }), h("span", { class: "title", title: s.title }, s.title)),
      h("div", { class: "m" }, [ago(s.mtime), s.subagents ? `${s.subagents} 个子 agent` : "主会话",

      h("span", {}, `${Math.floor(d.offset / d.limit) + 1} / ${Math.max(1, Math.ceil(d.total / d.limit))}`),
      h("button", { disabled: d.next_offset == null, "aria-label": "下一页会话", onclick: () => loadProject(id, state.projectSessions.next_offset).catch(showCatalogError) }, "下一页")));

function renderSessions() {

  $("projectCount").textContent = `${d.total} 个项目`;
  pager(d, $("projectsPrev"), $("projectsNext"), $("projectsPage"));

    ? `正在索引全部历史：${d.indexed} / ${d.index_expected || "…"} 个会话` : `已索引 ${d.indexed} 个会话 · 自动按主机和目录分组`;

function renderRemotes(remotes) {
  const bad = remotes.filter((r) => r.error && !r.connected);

  el.className = "pill" + (bad.length ? " err" : "");
  el.replaceChildren(...(remotes.length ? [h("span", { class: "dot " + (bad.length ? "error" : "ok") }),
    bad.length ? `${bad.map((r) => r.host).join(", ")} 连接失败` : "SSH " + remotes.map((r) => r.host).join(", ")] : []));
  el.title = remotes.map((r) => `${r.host}: ${r.connected ? "已连接" : r.error || "连接中"} · ${r.sessions} 个会话`).join("\n");

function renderHookState() {
  const on = state.hooksLast && now() - state.hooksLast < 3600;
  $("hookState").replaceChildren(h("span", { class: "dot " + (on ? "done" : "") }),
    on ? "hooks 已接入" : "hooks 未检测到（仅 jsonl）");

// ------------------------------------------------------------------ agent map
const FILTERS = [["all", "全部"], ["attention", "需要关注"], ["running", "运行中"],
  ["waiting", "待确认"], ["stale", "无更新"], ["finished", "已结束"]];

function rememberNavigation() {
  if (!state.nav || !state.sid) return;
  const ui = state.nav;
  state.navSaved[state.sid] = { focus: ui.focus, filter: ui.filter, view: ui.view,
    page: ui.query ? 0 : ui.page, pages: Object.fromEntries(Object.entries(ui.pages).slice(-50)) };
  const entries = Object.entries(state.navSaved).filter(([id]) => id !== state.sid).slice(-19);
  writeSetting("agentView.navigation", Object.fromEntries([...entries, [state.sid, state.navSaved[state.sid]]]));
}
function navigationFor(sid, nodes) {
  const saved = state.navSaved[sid] || {};
  return { focus: typeof saved.focus === "string" ? saved.focus : "main",
    filter: FILTERS.some(([key]) => key === saved.filter) ? saved.filter : nodes.length > 21 ? "attention" : "all",
    view: saved.view === "graph" ? "graph" : saved.view === "list" ? "list" :
      localStorage.getItem("agentView.view") === "graph" ? "graph" : "list",
    query: "", page: Number.isInteger(saved.page) ? saved.page : 0,
    pages: saved.pages && typeof saved.pages === "object" ? saved.pages : {}, highlight: null };
}
function selectSession(sid) {
  if (sid !== state.sid) {
    rememberNavigation();
    state.aid = null; state.transcript = null; state.full = false; state.open.clear(); state.groups.clear();
    state.detail = null; state.index = null; state.nav = null;
    $("agentQuery").value = "";
    $("mapNodes").replaceChildren(h("div", { class: "empty" }, "正在读取会话…"));
    $("mapViewport").scrollTop = 0;
    $("mapTitle").textContent = "加载会话…";
  }
  state.sid = sid;
  updateHash();
  renderSessions();
  loadDetail();
  showDetail(!!state.aid);
  loadSessions().catch(showCatalogError);
}
async function loadDetail() {
  if (!state.sid) return;
  const sid = state.sid, request = ++state.detailRequest;
  try {
    const d = await getJSON("/api/session?id=" + encodeURIComponent(sid));
    if (sid !== state.sid || request !== state.detailRequest) return;
    const first = !state.index;
    state.detail = d;
    state.index = Nav.buildIndex(d.nodes, state.index);
    if (!state.nav) state.nav = navigationFor(sid, d.nodes);
    if (first) {
      $("agentQuery").value = state.nav.query;
      if (state.aid && state.index.nodes.has(state.aid)) {
        const location = Nav.locate(state.index, state.aid);
        Object.assign(state.nav, location);
      }
    }
    renderMap();
  } catch (e) {

      $("mapNodes").replaceChildren(h("div", { class: "empty" }, "读取会话失败：" + e.message));

}
function descendantStats(id) {
  const result = { ...state.index.stats.get(id) }, status = state.index.nodes.get(id).status;
  result.total--;

  if (Nav.attention(status)) result.attention--;
  if (Nav.finished(status)) result.finished--;

}
function pageKey() { return state.nav.focus + "|" + state.nav.filter; }
function setAgentPage(page) {
  if (!state.nav) return;
  state.nav.page = page;

  state.nav.highlight = null;
  renderMap();

}

  rememberNavigation();
}
function filterNodes(filter) {

  state.nav.filter = filter;
  state.nav.page = 0;
  renderMap();
  $("mapViewport").scrollTop = 0;
  rememberNavigation();
}
function locateAgent(id) {

  if (!location) return;

  $("agentQuery").value = "";
  renderMap();
  const row = [...$("mapNodes").children].find(el => el.dataset.node === id);
  row?.scrollIntoView({ block: "nearest" });
  row?.querySelector("button")?.focus({ preventScroll: true });
  rememberNavigation();
}
function renderAgent(n) {
  const id = n.id, index = state.index, ui = state.nav;
  const stats = descendantStats(id), children = index.children.get(id)?.length || 0;
  const elapsed = n.started ? (active(n.status) ? now() : n.last || n.mtime) - n.started : null;
  const meta = [n.agent_type, n.background && "后台", n.tool?.name,
    n.tool?.brief, n.errors && `历史工具报错 ${n.errors} 次`].filter(Boolean).join(" · ");
  const row = h("article", { class: "agent-row" + (id === state.aid || id === ui.highlight ? " selected" : ""), "data-node": id },
    h("button", { class: "agent-select", "data-control": "record", "aria-pressed": String(id === state.aid),
      onclick: () => selectAgent(id) },
      h("div", { class: "agent-top" }, h("span", { class: "dot " + n.status }),
        h("span", { class: "agent-label", title: n.label }, n.label || id),
        h("span", { class: "st " + n.status, title: n.status === "stale" ? "一段时间没有新记录，状态可能来自推断" : STATUS[n.status] }, STATUS[n.status] || n.status),
        h("span", elapsed != null && active(n.status) ? { class: "st", "data-since": n.started, "data-prefix": "" } : { class: "st" }, elapsed != null ? dur(elapsed) : "")),
      h("div", { class: "agent-meta", title: [meta, `输出 ${ktok(n.out_tokens)} · ctx ${ktok(n.context_tokens)}`].join("\n") }, meta || id),
      ui.query ? h("div", { class: "agent-path", title: Nav.pathTo(index, id).join(" / ") },
        Nav.pathTo(index, id).slice(0, -1).map(key => key === "main" ? "主会话" : index.nodes.get(key).label).join(" › ")) : null));
  if (children || ui.query) row.append(h("div", { class: "agent-actions" },
    h("span", { class: "branch-counts" }, children
      ? `${children} 个直接子节点 · ${stats.running} 运行 · ${stats.waiting} 等待 · ${stats.stale} 无更新 · ${stats.finished} 已结束` : "直接子节点 0"),
    children ? h("button", { "data-control": "branch", onclick: () => focusNode(id) }, `进入分支 (${children})`) : null,
    ui.query ? h("button", { "data-control": "locate", onclick: () => locateAgent(id) }, "定位到层级") : null));

function renderMap() {

  ui.focus = page.focus; ui.page = page.page;

  const totals = descendantStats("main"), direct = index.children.get(ui.focus) || [];

  $("mapTitle").title = d.session.title;
  $("mapMeta").textContent = [d.session.host && "ssh " + d.session.host, d.session.cwd, d.session.entrypoint].filter(Boolean).join(" · ");
  $("mapMeta").title = $("mapMeta").textContent;

  const crumbSignature = JSON.stringify(path.map(id => [id, index.nodes.get(id).label]));
  if ($("breadcrumbs").dataset.signature !== crumbSignature) {
    $("breadcrumbs").replaceChildren(...path.flatMap((id, i) => [i ? h("span", {}, "›") : null,
      h("button", { title: index.nodes.get(id).label, "aria-current": id === ui.focus ? "location" : null,
        onclick: () => focusNode(id) }, id === "main" ? "主会话" : index.nodes.get(id).label)]).filter(Boolean));
    $("breadcrumbs").dataset.signature = crumbSignature;
    $("breadcrumbs").lastElementChild?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  $("parentDot").className = "dot " + parent.status;
  $("parentLabel").textContent = (ui.focus === "main" ? "主会话" : parent.label) + " · " + (STATUS[parent.status] || parent.status);
  $("parentLabel").title = parent.label || "主会话";
  $("parentStats").textContent = `直接子节点 ${direct.length} · 后代 ${stats.total} · 运行 ${stats.running} · 等待 ${stats.waiting} · 无更新 ${stats.stale}`;
  $("backToMain").disabled = ui.focus === "main" && !ui.query;
  $("agentsPrev").disabled = page.page === 0;
  $("agentsNext").disabled = page.page + 1 >= page.pages;
  $("pageSummary").textContent = `${ui.query ? "全会话搜索" : "本层筛选"} ${page.total} 个 · ${page.total ? page.offset + 1 : 0}–${page.offset + page.ids.length} · 共 ${page.pages} 页`;
  $("pageJump").max = String(page.pages);
  if (document.activeElement !== $("pageJump")) $("pageJump").value = page.page + 1;
  $("mapNodes").className = ui.view === "graph" ? "focus-graph" : "";
  keyedList($("mapNodes"), page.ids.map(id => index.nodes.get(id)), n => n.id, renderAgent, $("mapViewport"));
  if (!page.ids.length) $("mapNodes").replaceChildren(h("div", { class: "empty" }, ui.query
    ? "没有匹配的 agent，试试其他名称、工具或 ID" : ui.filter === "attention"
      ? "这一层没有需要关注的任务。已结束任务可在下方展开。" : "这一层没有符合筛选的子节点"));
  const closed = direct.filter(id => Nav.finished(index.nodes.get(id).status) && index.stats.get(id).attention === 0).length;
  $("finishedSummary").hidden = !closed || ui.filter !== "attention" || !!ui.query;
  if (closed) {
    // Only replace this fixed control when its count changes.
    if ($("finishedSummary").dataset.count !== String(closed)) {
      $("finishedSummary").replaceChildren(h("span", {}, `本层已折叠 ${closed} 个已结束子节点 `),
        h("button", { onclick: () => filterNodes("finished") }, "查看已结束任务"));
      $("finishedSummary").dataset.count = String(closed);
    }
  }
  const hiddenSelection = state.aid && !page.ids.includes(state.aid) && state.aid !== ui.focus && index.nodes.has(state.aid);
  $("selectionHint").hidden = !hiddenSelection;
  if (hiddenSelection && $("selectionHint").dataset.agent !== state.aid) {
    $("selectionHint").replaceChildren(h("span", {}, "当前阅读的任务不在本页 "),
      h("button", { onclick: () => locateAgent(state.aid) }, "定位当前记录"));
    $("selectionHint").dataset.agent = state.aid;
  }
}


// ------------------------------------------------------------------ transcript
function selectAgent(aid) {
  if (aid !== state.aid) { state.transcript = null; state.full = false; state.open.clear(); state.groups.clear(); }
  state.aid = aid;
  updateHash();
  renderMap();
  showDetail(true);
  loadTranscript(true);
}
function showDetail(on) {
  $("layout").classList.toggle("no-detail", !on);
  if (!on) state.aid = null;
}
async function loadTranscript(scrollEnd) {
  if (!state.sid || !state.aid) return;
  const key = state.sid + "/" + state.aid;
  const q = `/api/transcript?session=${encodeURIComponent(state.sid)}&agent=${encodeURIComponent(state.aid)}` +
            (state.full ? "&full=1" : "");
  try {
    const d = await getJSON(q);
    if (key !== state.sid + "/" + state.aid) return;
    state.transcript = d;
    renderTranscript(scrollEnd);
  } catch (e) {
    $("log").replaceChildren(h("div", { class: "empty" }, "读取记录失败：" + e.message));
  }
}
function renderTranscript(scrollEnd) {
  const node = state.detail?.nodes.find((n) => n.id === state.aid);
  $("dLabel").textContent = node ? (node.id === "main" ? "主会话" : node.label) : state.aid;
  $("dDot").className = "dot " + (node?.status || "");
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const d = state.transcript;
  const results = {};
  for (const it of d.items) if (it.role === "tool_result") results[it.id] = it;
  const out = [];
  if (d.truncated) out.push(h("div", { class: "note" }, "只显示了最近的一部分，点右上角「全部」加载完整记录"));
  const toggle = (k) => () => { state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderTranscript(false); };
  // Consecutive tool calls (with their results) form one run; runs of 2+ collapse into a group.
  const runs = [];
  let run = null;
  d.items.forEach((it, i) => {
    if (it.role === "tool_use" || it.role === "tool_result") {
      if (!run) runs.push(run = { tools: [], idx: [] });
      run.idx.push(i);
      if (it.role === "tool_use") run.tools.push(it);
    } else {
      run = null;
      runs.push({ idx: [i] });
    }
  });
  const renderItem = (it, i, out) => {
    if (it.role === "tool_result") {
      if (!d.items.some((x) => x.role === "tool_use" && x.id === it.id))  // orphan (use was cut off)
        out.push(h("div", { class: "tu" }, h("pre", { class: "res" + (it.is_error ? " err" : "") }, it.text)));
      return;
    }
    if (it.role === "tool_use") {
      const r = results[it.id], k = "u" + it.id, open = state.open.has(k);
      const resText = r ? (r.is_error ? "✕ 出错" : "✓") : "…";
      out.push(h("div", { class: "tu" },
        h("div", { class: "h", onclick: toggle(k) },
          h("span", { class: "n" }, it.name), h("span", { class: "b", title: it.brief }, it.brief),
          h("span", { class: "r" + (r?.is_error ? " err" : r ? "" : " pending") }, resText)),
        open ? h("pre", {}, it.input) : null,
        open && r ? h("pre", { class: "res" + (r.is_error ? " err" : "") }, r.text || "(空)") : null));
      return;
    }
    const who = { user: "用户", assistant: "Claude", thinking: "思考", system: "" }[it.role];
    const html = it.role !== "system" ? markdown(it.text) : null;
    const k = "t" + i;
    out.push(h("div", { class: "msg " + it.role + (state.open.has(k) ? " open" : ""),
                        onclick: it.role === "thinking" ? toggle(k) : null },
      who ? h("div", { class: "who" }, who + (it.ts ? " · " + new Date(it.ts * 1000).toLocaleTimeString() : "")) : null,
      html == null ? h("div", { class: "body" }, it.text) : mdBody(html)));
  };
  runs.forEach((g, gi) => {
    if (!g.tools || g.tools.length < 2) { g.idx.forEach((i) => renderItem(d.items[i], i, out)); return; }
    const k = "g" + g.tools[0].id;
    const pending = g.tools.filter((t) => !results[t.id]).length;
    const errs = g.tools.filter((t) => results[t.id]?.is_error).length;
    // default: collapsed, except the live run at the very end so following output stays visible
    const open = state.groups.has(k) ? state.groups.get(k) : (gi === runs.length - 1 && pending > 0);
    const counts = new Map();
    for (const t of g.tools) {
      const n = t.name.replace(/^mcp__.+?__/, "");  // mcp__server__tool -> tool
      counts.set(n, (counts.get(n) || 0) + 1);
    }
    const names = [...counts].map(([n, c]) => c > 1 ? `${n}×${c}` : n).join(" · ");
    const body = [];
    g.idx.forEach((i) => renderItem(d.items[i], i, body));
    out.push(h("div", { class: "tg" + (open ? " open" : "") },
      h("div", { class: "gh", onclick: () => { state.groups.set(k, !open); renderTranscript(false); } },
        h("span", { class: "caret" }, "▶"),
        h("span", {}, `${g.tools.length} 次工具调用`),
        h("span", { class: "names", title: names }, names),
        h("span", { class: "r" + (pending ? " pending" : errs ? " err" : "") },
          pending ? `… ${pending} 进行中` : errs ? `✕ ${errs} 出错` : "✓")),
      h("div", { class: "gb" }, ...body)));
  });
  if (!d.items.length) out.push(h("div", { class: "empty" }, "还没有内容"));
  log.replaceChildren(...out);
  if (scrollEnd || ($("follow").checked && atBottom)) log.scrollTop = log.scrollHeight;
}

// ------------------------------------------------------------------ live updates
const refreshDetail = debounce(loadDetail, 400);
const refreshTranscript = debounce(() => loadTranscript(false), 700);
const refreshSessions = debounce(() => loadSessions().catch(() => {}), 1500);

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => $("connState").replaceChildren(h("span", { class: "dot running" }), "实时");
  es.onerror = () => $("connState").replaceChildren(h("span", { class: "dot stale" }), "已断开，重连中");
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "hello") { refreshSessions(); if (state.sid) refreshDetail(); return; }
    if (e.type === "focus") { followFocus(e.sid); return; }
    const sids = e.type === "changed" ? e.sessions : [e.session];
    if (e.type === "hook") state.hooksLast = now();
    if (sids.includes(state.sid)) {
      refreshDetail();
      if (state.aid && (e.type === "changed" || e.agent === state.aid)) refreshTranscript();
    }
    refreshSessions();
  };
}

// "跟随 Desktop": show whichever session is focused in Claude Desktop. When this page itself
// has focus, the newly focused session is the one hosting this Browser pane: remember it and
// stay put, so clicking into the pane never makes it jump to its own session.
function followFocus(sid) {
  if (!sid || sid === state.focused) return;
  state.focused = sid;
  if (document.hasFocus()) { state.hostSid = sid; return; }
  if ($("followDesktop").checked && sid !== state.hostSid && sid !== state.sid) selectSession(sid);
}
const paneQuery = new URLSearchParams(location.search);
const embedded = paneQuery.get("embedded") === "1" || paneQuery.has("desktop_session");
$("followDesktop").checked = !embedded && localStorage.getItem("agentView.follow") === "1";
if (embedded) {
  document.body.classList.add("embedded");
  $("followDesktop").closest("label").style.display = "none";
  $("toggleSessions").style.display = "none";
}
$("followDesktop").onchange = (e) => {
  localStorage.setItem("agentView.follow", e.target.checked ? "1" : "0");
  if (e.target.checked) refreshSessions();
};

// Markdown / MyST / LaTeX rendering (bundle inlined by the server; plain text if it is missing).
const mdCache = new Map();
function markdown(text) {
  if (!text || !$("renderMd").checked || !window.AgentMarkdown) return null;
  let html = mdCache.get(text);
  if (html == null) {
    try { html = AgentMarkdown.render(text); } catch { return null; }
    if (mdCache.size > 500) mdCache.delete(mdCache.keys().next().value);
    mdCache.set(text, html);
  }
  return html;
}
function mdBody(html) {
  const el = h("div", { class: "body md" });
  el.innerHTML = html;  // markdown-it runs with html:false, so message text cannot inject markup
  return el;
}
$("renderMd").checked = localStorage.getItem("agentView.md") !== "0";
$("renderMd").onchange = (e) => {
  localStorage.setItem("agentView.md", e.target.checked ? "1" : "0");
  if (state.transcript) renderTranscript(false);
};

function updateHash() {
  const p = new URLSearchParams();
  if (state.sid) p.set("s", state.sid);
  if (state.aid) p.set("a", state.aid);
  history.replaceState(null, "", "#" + p.toString());
}

function resetSessionSearch() {
  state.projectOffset = 0; state.projectOpen = undefined; state.projectSessions = null;
  state.projectRequest++; state.sidebarRequest++;
  loadSessions().catch(showCatalogError);
}
$("onlyActive").onchange = resetSessionSearch;
$("sessionQuery").addEventListener("input", debounce(resetSessionSearch, 250));
$("projectsPrev").onclick = () => {
  state.projectOffset = Math.max(0, state.projectOffset - 20); state.projectOpen = undefined;
  loadSessions().catch(showCatalogError);
};
$("projectsNext").onclick = () => {
  if (state.catalog?.next_offset == null) return;
  state.projectOffset = state.catalog.next_offset; state.projectOpen = undefined;
  loadSessions().catch(showCatalogError);
};
$("currentSession").onclick = () => {
  $("sessionQuery").value = ""; $("onlyActive").checked = false; state.projectOffset = 0;
  loadSessions(true).catch(showCatalogError);
};
for (const [key, label] of FILTERS) $("mapCounts").append(h("button", {
  id: "filter-" + key, onclick: () => filterNodes(key),
  title: key === "stale" ? "一段时间没有新记录，可能是根据 transcript 推断的状态" : label }, label));
$("agentQuery").addEventListener("input", () => {
  if (!state.nav) return;
  const query = $("agentQuery").value.trim();
  if (query && !state.nav.query) state.nav.filter = "all";
  state.nav.query = query; state.nav.page = 0;
  renderMap(); $("mapViewport").scrollTop = 0;
});
function setMapView(view) {
  if (!state.nav) return;
  state.nav.view = view; renderMap(); rememberNavigation();
}
$("listView").onclick = () => setMapView("list");
$("graphView").onclick = () => setMapView("graph");
$("parentRecord").onclick = () => { if (state.nav) selectAgent(state.nav.focus); };
$("backToMain").onclick = () => focusNode("main");
$("agentsPrev").onclick = () => { if (state.nav) setAgentPage(state.nav.page - 1); };
$("agentsNext").onclick = () => { if (state.nav) setAgentPage(state.nav.page + 1); };
$("pageJump").onchange = () => setAgentPage(Math.max(0, Number($("pageJump").value) - 1));
$("toggleSessions").onclick = () => document.body.classList.toggle("show-sessions");
$("closeDetail").onclick = () => { showDetail(false); updateHash(); renderMap(); };
$("loadFull").onclick = () => { state.full = true; loadTranscript(false); };
// tick: only touch the live duration texts so clicks are never swallowed by a re-render
setInterval(() => {
  for (const el of document.querySelectorAll("[data-since]"))
    el.textContent = el.dataset.prefix + dur(now() - Number(el.dataset.since));
  renderHookState();
}, 1000);

(function init() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (embedded && window.__AGENT_VIEW_DESKTOP_SESSION__) p.set("s", window.__AGENT_VIEW_DESKTOP_SESSION__);
  if (p.get("s")) { state.sid = p.get("s"); state.aid = p.get("a"); }
  loadSessions(!!state.sid).catch((e) => {
    showCatalogError(e);
    $("mapNodes").replaceChildren(h("div", { class: "empty" }, "连不上服务：" + e.message));
  });
  if (state.sid) { loadDetail(); if (state.aid) { showDetail(true); loadTranscript(true); } }
  connect();
})();
</script>
</body>
</html>
